name: Clearview
options:
  bundleIdPrefix: com.brasslanternstudios
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: 354ZXG6M8K
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  Clearview:
    type: application
    platform: macOS
    sources: [Clearview]
    info:
      path: Clearview/Info.plist
      properties:
        CFBundleDisplayName: Clearview
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSScreenCaptureUsageDescription: Clearview captures your screen to show what a teammate would see.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brasslanternstudios.clearview
        ENABLE_HARDENED_RUNTIME: NO
  ClearviewTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClearviewTests]
    dependencies:
      - target: Clearview
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clearview:
    build:
      targets:
        Clearview: all
        ClearviewTests: [test]
    test:
      targets: [ClearviewTests]
